[project]
name = "meeting-notes-stt"
version = "0.1.0"
description = "SageMaker async inference container: CrisperWhisper 2.0 transcription + pyannote diarization"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "boto3>=1.35",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pydantic>=2.8",
]

[project.optional-dependencies]
# GPU container (x86_64 only): CT2 backend + pyannote 4 (torch>=2.8). Installed explicitly in the Dockerfile.
gpu = ["crisperwhisper[ct2]==2.0.2", "pyannote.audio>=4.0.0,<5"]
# Local dev on any arch: transformers backend (no CT2 wheel on aarch64).
local = ["crisperwhisper[transformers]==2.0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
