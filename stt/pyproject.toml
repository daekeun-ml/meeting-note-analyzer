[project]
name = "meeting-notes-stt"
version = "0.1.0"
description = "Selectable Qwen/CrisperWhisper/ARK transcription and Nemotron/pyannote diarization on SageMaker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "boto3>=1.35",
  "numpy>=1.26",
  "soundfile>=0.12",
  "pydantic>=2.8",
]

[project.optional-dependencies]
# GPU container (x86_64 only): CT2 backend + pyannote 4 (torch>=2.8). Installed explicitly in the Dockerfile.
gpu = ["crisperwhisper[ct2]==2.0.2", "pyannote.audio>=4.0.0,<5", "transformers==5.20.1", "accelerate>=1.0,<2", "librosa>=0.11,<0.12", "soynlp==0.0.493", "nagisa==0.3.0"]
# Local dev on any arch: transformers backend (no CT2 wheel on aarch64).
local = ["crisperwhisper[transformers]==2.0.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
# Keep these security floors in sync with security-constraints.txt for the GPU image.
constraint-dependencies = [
  "certifi>=2026.10.19", "urllib3>=2.8.0", "pillow>=13.0.0",
  "opentelemetry-api>=1.45.1", "aiohttp>=3.14.4", "filelock>=4.2.1",
  "lightning>=2.6.6", "pytorch-lightning>=2.6.6", "mako>=1.4.2",
  "multidict>=6.9.1", "setuptools>=84.1.0",
  "accelerate>=1.15.0",
]
