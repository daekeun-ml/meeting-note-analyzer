version: 0.2
# Runs in the x86_64 CodeBuild project created by SttStack. Env: DATA_BUCKET, MODEL_VARIANT, HF_TOKEN (Secrets Manager).
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install --quiet --upgrade pip filelock setuptools -c security-constraints.txt
      - pip install --quiet "torch==2.8.0" --index-url https://download.pytorch.org/whl/cpu -c security-constraints.txt
      - pip install --quiet -c security-constraints.txt "crisperwhisper[ct2,convert]==2.0.2" "huggingface_hub>=0.34,<1" "transformers>=4.40,<5" "accelerate>=1.15.0" "boto3>=1.35"
  build:
    commands:
      - python publish_model.py "$MODEL_VARIANT" /tmp/models
      - aws s3 sync /tmp/models/ "s3://$DATA_BUCKET/$SPEECH_MODEL_PREFIX" --delete --no-progress
      - aws s3 cp /tmp/models/bundle-manifest.json "s3://$DATA_BUCKET/${SPEECH_MODEL_PREFIX}ready.json" --content-type application/json --no-progress
      - aws s3 ls "s3://$DATA_BUCKET/$SPEECH_MODEL_PREFIX" --recursive --summarize | tail -3
