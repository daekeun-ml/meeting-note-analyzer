[project]
name = "meeting-agents"
version = "0.1.0"
description = "AgentCore Runtime: Claude Agent SDK multi-agent meeting analysis stages"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2.152",
  "bedrock-agentcore>=1.22.0",
  "boto3>=1.40",
  "pydantic>=2.8",
  "openinference-instrumentation-claude-agent-sdk>=0.1.3",
  "aws-opentelemetry-distro>=0.12.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
constraint-dependencies = [
  "certifi>=2026.10.19", "urllib3>=2.8.0", "mcp>=2.2.0",
  "PyJWT>=2.15.0",
]
# AWS distro pins opentelemetry-api 1.44.0. telemetry_security bounds inbound
# tracestate until AWS releases a distro compatible with API >=1.45.1.
